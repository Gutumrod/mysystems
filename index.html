<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลิงก์ด่วน</title>
  <style>
    :root {
      --bg: #101214;
      --panel: #181b1f;
      --border: #30343a;
      --text: #f5f5f5;
      --muted: #a8adb5;
      --accent: #ffcf07;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(640px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    h1 {
      margin: 0 0 20px;
    }

    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .card a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    .card a:hover {
      color: var(--accent);
    }

    .card small {
      display: block;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
      word-break: break-all;
    }

    .del-btn {
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .del-btn:hover {
      color: var(--danger);
      background: #2a2020;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-top: 24px;
    }

    input {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0c0e10;
      color: var(--text);
      padding: 10px;
      font: inherit;
    }

    button[type="submit"] {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #050505;
      font-weight: 700;
      padding: 10px;
      cursor: pointer;
    }

    .empty {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>ลิงก์ด่วน</h1>
    <div id="list"></div>

    <form id="addForm">
      <input id="label" placeholder="ชื่อ / คืออะไร (เช่น เช็คงานหน้าร้าน)" required>
      <input id="url" type="url" placeholder="https://..." required>
      <button type="submit">เพิ่มลิงก์</button>
    </form>
  </main>

  <script>
    const STORAGE_KEY = 'personal_links_hub_v1';
    const DEFAULT_LINKS = [
      { label: 'เช็คงานหน้าร้าน', url: 'https://kmorackbarcustom.github.io/bookingdashboard.html' },
      { label: 'เช็คงานออเดอร์', url: 'https://kmorackbarcustom.github.io/AdminOrderDashboard.html' },
      { label: 'จองคิว', url: 'https://kmorackbarcustom.github.io/booking.html' },
      { label: 'สั่งออเดอร์', url: 'https://kmorackbarcustom.github.io/ShopeeOrder.html' },
      { label: 'คำนวนเงินใน Shopee', url: 'https://gutumrod.github.io/mysystems/shopee-calc.html' },
      { label: 'ปิด AI ตอบแชทไลน์', url: 'https://kmorackbarcustom.github.io/admin-line-reply.html' },
    ];

    function loadLinks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (error) {
        console.error('load failed', error);
      }
      saveLinks(DEFAULT_LINKS);
      return DEFAULT_LINKS;
    }

    function saveLinks(links) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
    }

    function render() {
      const links = loadLinks();
      const list = document.getElementById('list');
      list.replaceChildren();

      if (links.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'ยังไม่มีลิงก์ เพิ่มด้านล่างได้เลย';
        list.appendChild(empty);
        return;
      }

      links.forEach((link, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        const a = document.createElement('a');
        a.href = link.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = link.label;
        const small = document.createElement('small');
        small.textContent = link.url;
        a.appendChild(small);

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = '✕';
        delBtn.title = 'ลบลิงก์นี้';
        delBtn.addEventListener('click', () => {
          const current = loadLinks();
          current.splice(index, 1);
          saveLinks(current);
          render();
        });

        card.append(a, delBtn);
        list.appendChild(card);
      });
    }

    document.getElementById('addForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const label = document.getElementById('label').value.trim();
      const url = document.getElementById('url').value.trim();
      if (!label || !url) return;

      const links = loadLinks();
      links.push({ label, url });
      saveLinks(links);
      event.target.reset();
      render();
    });

    render();
  </script>
</body>
</html>
