<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลิงก์ด่วน</title>
  <style>
    :root {
      --bg: #101214;
      --panel: #181b1f;
      --border: #30343a;
      --text: #f5f5f5;
      --muted: #a8adb5;
      --accent: #ffcf07;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(640px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    h1 {
      margin: 0 0 20px;
    }

    .project-title {
      color: var(--accent);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 24px 0 8px;
    }

    .project-title:first-of-type {
      margin-top: 0;
    }

    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .card a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    .card a:hover {
      color: var(--accent);
    }

    .card small {
      display: block;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
      word-break: break-all;
    }

    .del-btn {
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .del-btn:hover {
      color: var(--danger);
      background: #2a2020;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-top: 24px;
    }

    input {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0c0e10;
      color: var(--text);
      padding: 10px;
      font: inherit;
    }

    button[type="submit"] {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #050505;
      font-weight: 700;
      padding: 10px;
      cursor: pointer;
    }

    .empty {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>ลิงก์ด่วน</h1>
    <div id="list"></div>

    <form id="addForm">
      <input id="project" list="projectOptions" placeholder="โปรเจค (เช่น KMO)" required>
      <datalist id="projectOptions"></datalist>
      <input id="label" placeholder="ชื่อ / คืออะไร (เช่น เช็คงานหน้าร้าน)" required>
      <input id="url" type="url" placeholder="https://..." required>
      <button type="submit">เพิ่มลิงก์</button>
    </form>
  </main>

  <script>
    const SUPA_URL = 'https://ybyseaenceyswjnwdmdf.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlieXNlYWVuY2V5c3dqbndkbWRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3OTk3MTgsImV4cCI6MjA4OTM3NTcxOH0.NpaB7XrM0MzTknMvFLKkN57WG7_GkCb9zxZQUROz9Ug';
    const UNCATEGORIZED = 'อื่นๆ';

    async function supaFetch(path, options = {}) {
      const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
        ...options,
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${SUPA_KEY}`,
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });
      if (!res.ok) throw new Error(await res.text());
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    const loadLinks = () => supaFetch('links?select=*&order=created_at.asc');
    const addLink = (link) => supaFetch('links', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(link) });
    const deleteLink = (id) => supaFetch(`links?id=eq.${id}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });

    function updateProjectOptions(links) {
      const projects = [...new Set(links.map((link) => link.project || UNCATEGORIZED))];
      const datalist = document.getElementById('projectOptions');
      datalist.replaceChildren();
      projects.forEach((project) => {
        const option = document.createElement('option');
        option.value = project;
        datalist.appendChild(option);
      });
    }

    async function render() {
      const list = document.getElementById('list');
      let links;
      try {
        links = await loadLinks();
      } catch (error) {
        list.replaceChildren();
        const errEl = document.createElement('p');
        errEl.className = 'empty';
        errEl.textContent = `โหลดลิงก์ไม่สำเร็จ: ${error.message}`;
        list.appendChild(errEl);
        return;
      }

      list.replaceChildren();
      updateProjectOptions(links);

      if (links.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'ยังไม่มีลิงก์ เพิ่มด้านล่างได้เลย';
        list.appendChild(empty);
        return;
      }

      const groups = new Map();
      links.forEach((link) => {
        const project = link.project || UNCATEGORIZED;
        if (!groups.has(project)) groups.set(project, []);
        groups.get(project).push(link);
      });

      for (const [project, groupLinks] of groups) {
        const title = document.createElement('h2');
        title.className = 'project-title';
        title.textContent = project;
        list.appendChild(title);

        groupLinks.forEach((link) => {
          const card = document.createElement('div');
          card.className = 'card';

          const a = document.createElement('a');
          a.href = link.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = link.label;
          const small = document.createElement('small');
          small.textContent = link.url;
          a.appendChild(small);

          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.textContent = '✕';
          delBtn.title = 'ลบลิงก์นี้';
          delBtn.addEventListener('click', async () => {
            delBtn.disabled = true;
            await deleteLink(link.id);
            render();
          });

          card.append(a, delBtn);
          list.appendChild(card);
        });
      }
    }

    document.getElementById('addForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const project = document.getElementById('project').value.trim();
      const label = document.getElementById('label').value.trim();
      const url = document.getElementById('url').value.trim();
      if (!project || !label || !url) return;

      const submitBtn = event.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        await addLink({ project, label, url });
        event.target.reset();
        await render();
      } finally {
        submitBtn.disabled = false;
      }
    });

    render();
  </script>
</body>
</html>
